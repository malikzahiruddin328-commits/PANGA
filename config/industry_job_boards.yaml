# Extensible list of industry-specific job sources (PRD §13), beyond the
# generic boards already covered by connectors (ZipRecruiter, Dice) and the
# USAJOBS API client. Grows over time as new sources are researched/vetted -
# same "ever-growing lookup" pattern as config/role_skills lookups.
#
# access_method values:
#   public_html   -> no API/RSS found; would mean fetching public search-result
#                    pages (no login required, low ToS risk, but fragile/breaks
#                    if the site's HTML changes - build only when worth the effort)
#   freemium      -> free to browse, paid tier unlocks more (e.g. full apply access)
#   js_rendered   -> confirmed 2026-07-29: raw HTML has no listing data, needs a
#                    headless browser (e.g. Playwright) to render - not attempted,
#                    plain requests/BeautifulSoup won't work here
#   blocked       -> confirmed 2026-07-29: 403/429 on repeated attempts, active
#                    bot-blocking - not a plain-requests target
# status: candidate (researched, not yet built against) | built | rejected
#
# Full-site reconnaissance done 2026-07-29 (19 sites checked for scrapeability
# before writing any scraper code) - see docs/daily-job-search-task.md for the
# summary. Notably: the 3 sites originally flagged as most IT-relevant (Life
# Search Technologies, TSP Life Sciences, Frontline Source Group) all turned
# out blocked or JS-only - don't assume "most relevant" means "easiest to build."

pharma_job_boards:
  - name: Planet Pharma
    url: "https://careers.planet-pharma.com/job-search/"
    note: "Life sciences staffing firm. BUILT 2026-07-29 (src/search/industry_boards.py fetch_planet_pharma_jobs) - WordPress/FacetWP site; category filtering (?_job_category=) only applies via JS-triggered AJAX, not a plain URL param, so the scraper fetches the default listing and lets compatibility scoring filter for relevance, same pattern as USAJOBS/ZipRecruiter/Dice. Confirmed working: 10 real jobs pulled and saved."
    access_method: public_html
    status: built

  - name: BioSpace
    url: "https://jobs.biospace.com/searchjobs/?countrycode=US&Page=1"
    note: "Largest pharma/biotech board (3,800+ jobs); has a strong IT/digital leadership section. No job-listings RSS/API (checked 2026-07-28). Confirmed scrapeable 2026-07-29: server-rendered HTML, clean ?countrycode=US&Page=N pagination, no blocking. Not yet built - next candidate after Planet Pharma."
    access_method: public_html
    status: candidate

  - name: RAPS Career Center
    url: "https://regulatorycareers.raps.org/"
    note: "Regulatory affairs focused, crosses into IT/quality-governance roles relevant to GxP/CSV background. Confirmed BLOCKED 2026-07-29 - 403 Forbidden on root and /jobs."
    access_method: blocked
    status: rejected

  - name: FierceBiotech Jobs
    url: "https://jobs.fiercebiotech.com/"
    note: "Runs on the shared 'Life Sciences Job Network.' Confirmed BLOCKED 2026-07-29 - 403 Forbidden on root and /jobs."
    access_method: blocked
    status: rejected

