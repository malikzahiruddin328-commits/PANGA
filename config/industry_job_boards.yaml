general_job_aggregators:
  - name: Lensa
    url: "https://career.lensa.com/"
    note: "Free for job seekers (monetized via ads/affiliate traffic). Aggregates and republishes listings pulled from other sources, so results likely overlap with ZipRecruiter/Dice/Indeed - dedup by posting URL if built. 'Lensa Connect' API exists but is a paid partner/publisher integration, not an open jobseeker-side API. Reconnaissance 2026-07-29: root lensa.com returned 402; career.lensa.com rendered a couple of listings server-side but looked like Lensa's own corporate careers page, not their aggregator job board - needs manual verification before building."
    access_method: public_html
    status: candidate

